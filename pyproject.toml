[project]
name = "chip"
version = "0.1.0"
description = "CHIP (Confounding Hash Iteration for Passwords): an iterated, collision-driven password hash from a 2018 research paper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karl Preisner" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.17", "mypy>=2.4", "pytest>=9.0"]
bench = ["numpy>=2.0"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "bench"]

[tool.ruff]
line-length = 100
extend-exclude = ["old"]
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, N naming, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
