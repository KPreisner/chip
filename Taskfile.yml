version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  uv-sync:
    desc: Install/update the virtual environment from uv.lock
    cmds:
      - uv sync

  py-lint:
    desc: Lint, check formatting, and type check (same as CI)
    cmds:
      - uv run ruff check
      - uv run ruff format --check
      - uv run mypy

  py-format:
    desc: Auto-format and apply safe lint fixes (incl. import sorting)
    cmds:
      - uv run ruff check --fix
      - uv run ruff format

  py-test:
    desc: Run unit tests
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  bench:
    desc: Quick benchmark (b 1–20, 100 runs) into benchmarks/results-quick/
    cmds:
      - uv run python benchmarks/iterations.py --max-bits 20 --runs 100 --out benchmarks/results-quick

  bench-full:
    desc: Full benchmark (b 1–32, C 1–20, 1,000 runs) into benchmarks/results/
    cmds:
      - uv run python benchmarks/iterations.py

  bench-memory:
    desc: Memory benchmark (b 24–34 × C 5–30, 100 runs) into benchmarks/results/
    cmds:
      - uv run python benchmarks/memory.py
